spring:
  application:
    name: users-service-task

upstream:
  base-url: https://jsonplaceholder.typicode.com
  connect-timeout: 1s
  # Users is required: allow a bit more time before we give up.
  users-read-timeout: 2s
  # Posts can take up to 3s upstream. We deliberately cut it off earlier and degrade.
  posts-read-timeout: 1500ms
  # Retries (in addition to the first attempt) for the posts call on 5xx / IO errors.
  posts-retries: 1
  # Hard budget for the whole endpoint. Retries never push the response past this.
  overall-deadline: 3s
